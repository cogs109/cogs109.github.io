# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: COGS 109
tagline: Modeling and Data Analysis 📊  
description: How can we use models to understand data and predict the world around us?
author: Lucy Lai
baseurl: '' # the subpath of your site, e.g. /blog
url: 'https://cogs109.github.io' # the base hostname & protocol for your site, e.g. http://example.com
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE
  - README.md

# Theme settings
remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: blue
search_enabled: true
heading_anchors: true
permalink: pretty
aux_links:
  🖼️ Canvas:
    - 'https://canvas.ucsd.edu/courses/78581'
  🙋🏻 Piazza:
    - 'https://piazza.com/class/mu5yx4xo2vt1lq/#'
  💯 Gradescope:
    - 'https://www.gradescope.com/courses/1403410/'
  🎙️ Podcast:
    - 'https://podcast.ucsd.edu/watch/fa26/cogs109_b00'
footer_content:

# Course info shown as badges on the home page
course_vars:
  quarter: 'Fall 2026'
  building: 'COA 130'
  timings: 'MWF 9:00-9:50am'

# Callout styles (.important, .note, ...) used by _includes/notices.html and by
# `{: .important }` in page markdown. The theme defines these in its own
# _config.yml, but Jekyll does not merge a remote theme's config, so without
# this block every callout renders as an unstyled paragraph.
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Collections for website data
collections:
  staffers:
  modules:
  schedules:
  announcements:
# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer
      subpath: '/assets/images/'
  - scope:
      path: ''
      type: modules
    values:
      layout: module
  - scope:
      path: ''
      type: schedules
    values:
      layout: schedule

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
  - jemoji
