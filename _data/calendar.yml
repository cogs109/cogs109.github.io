# ─────────────────────────────────────────────────────────────────────────────
#  COURSE CALENDAR — one entry per week, rendered on the home page.
#
#  Edit this file and push; the calendar rebuilds itself. Nothing else to touch.
#
#  Each week:
#    week     the week number shown in the second column
#    month    only on the first week of a new month; draws the coloured band
#    topic    the "Topic / ISLP Reading" cell (markdown, use | for line breaks)
#    mon / wed / fri
#      date     e.g. "Sept 28"
#      lec      e.g. "Lec 1"  (omit for exams, holidays, etc.)
#      title    what the class covers
#      event    big red text instead of a lecture, e.g. "EXAM 1"
#      note     small red italic line, e.g. drop deadlines
#      due      list of assignments; each becomes a submission link. Either
#               write the name on its own, or give it a url of its own:
#
#                 due:
#                   - Quiz 2
#                   - Homework 2
#                   - name: Project groups survey
#                     url: https://forms.gle/YOUR_FORM_ID
#
#               Without a url, the link is looked up in `submit:` in
#               _config.yml -- first the whole name, then its first word
#               ("Quiz 1" -> submit.Quiz), then submit.default.
#      section  (fri only) what happens in discussion section
# ─────────────────────────────────────────────────────────────────────────────

